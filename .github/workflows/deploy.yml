name: Passtival-Backend of Deploy to Production
on:
  push:
    branches:
      - main # main에 푸시될 때 실행
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
  DEPLOY_ENV_PATH: ${{ vars.DEPLOY_ENV_PATH }}
  DEPLOY_MOUNT_PATH: ${{ vars.DEPLOY_MOUNT_PATH }}
  EC2_TARGET_TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
  EC2_TARGET_TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
  HEALTHCHECK_PATH: ${{ vars.HEALTHCHECK_PATH }}
  HEALTHCHECK_TIMEOUT_SECONDS: ${{ vars.HEALTHCHECK_TIMEOUT_SECONDS }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃 코드
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: JDK-17 설치
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: gradlew 실행 권한 부여, Gradle 빌드
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: 빌드 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          if-no-files-found: error

  deploy:
    # 배포 워크플로는 main 브랜치에 푸시되거나 수동으로 트리거될 때만 실행한다.
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃 코드
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 배포 설정값 검증
        run: |
          command -v jq >/dev/null
          test -n "${AWS_REGION}"
          test -n "${DEPLOY_DIR}"
          test -n "${DEPLOY_ENV_PATH}"
          test -n "${DEPLOY_MOUNT_PATH}"
          test -n "${EC2_TARGET_TAG_KEY}"
          test -n "${EC2_TARGET_TAG_VALUE}"
          test -n "${HEALTHCHECK_PATH}"
          test -n "${HEALTHCHECK_TIMEOUT_SECONDS}"
          test -f backend/run.sh
          test -f backend/docker-compose.yml
          [[ "${HEALTHCHECK_TIMEOUT_SECONDS}" =~ ^[0-9]+$ ]]

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 빌드 산출물 다운로드
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/passtival-spring:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/passtival-spring:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 배포 파일 인코딩
        id: deploy_files
        run: |
          RUN_SH_SHA256=$(sha256sum backend/run.sh | awk '{print $1}')
          COMPOSE_YML_SHA256=$(sha256sum backend/docker-compose.yml | awk '{print $1}')
          {
            echo "run_sh_b64<<EOF"
            base64 -w 0 backend/run.sh
            echo
            echo "EOF"
            echo "compose_yml_b64<<EOF"
            base64 -w 0 backend/docker-compose.yml
            echo
            echo "EOF"
            echo "run_sh_sha256=${RUN_SH_SHA256}"
            echo "compose_yml_sha256=${COMPOSE_YML_SHA256}"
          } >> "$GITHUB_OUTPUT"

      - name: AWS 자격 증명 구성 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포 대상 인스턴스 조회
        id: discover
        run: |
          INSTANCE_IDS_RAW=$(aws ec2 describe-instances \
            --filters "Name=tag:${EC2_TARGET_TAG_KEY},Values=${EC2_TARGET_TAG_VALUE}" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          mapfile -t INSTANCE_IDS < <(printf '%s\n' ${INSTANCE_IDS_RAW} | sed '/^$/d' | sort)
          COUNT=${#INSTANCE_IDS[@]}

          echo "Discovered instances (${COUNT}): ${INSTANCE_IDS[*]}"

          if [[ "${COUNT}" -ne 2 ]]; then
            echo "Expected exactly 2 running instances for ${EC2_TARGET_TAG_KEY}=${EC2_TARGET_TAG_VALUE}, but got ${COUNT}."
            exit 1
          fi

          echo "instance_1=${INSTANCE_IDS[0]}" >> "$GITHUB_OUTPUT"
          echo "instance_2=${INSTANCE_IDS[1]}" >> "$GITHUB_OUTPUT"

      - name: 인스턴스 1 롤링 배포
        env:
          TARGET_INSTANCE_ID: ${{ steps.discover.outputs.instance_1 }}
          RUN_SH_B64: ${{ steps.deploy_files.outputs.run_sh_b64 }}
          COMPOSE_YML_B64: ${{ steps.deploy_files.outputs.compose_yml_b64 }}
          RUN_SH_SHA256: ${{ steps.deploy_files.outputs.run_sh_sha256 }}
          COMPOSE_YML_SHA256: ${{ steps.deploy_files.outputs.compose_yml_sha256 }}
        run: |
          REMOTE_SCRIPT_B64=$(cat <<EOF | base64 -w 0
          set -euo pipefail
          mkdir -p "${DEPLOY_DIR}"
          printf '%s' '${RUN_SH_B64}' | base64 --decode > "${DEPLOY_DIR}/run.sh.new"
          printf '%s' '${COMPOSE_YML_B64}' | base64 --decode > "${DEPLOY_DIR}/docker-compose.yml.new"
          mv -f "${DEPLOY_DIR}/run.sh.new" "${DEPLOY_DIR}/run.sh"
          mv -f "${DEPLOY_DIR}/docker-compose.yml.new" "${DEPLOY_DIR}/docker-compose.yml"
          chmod +x "${DEPLOY_DIR}/run.sh"
          ACTUAL_RUN_SH_SHA256=\$(sha256sum "${DEPLOY_DIR}/run.sh" | awk '{print \$1}')
          ACTUAL_COMPOSE_YML_SHA256=\$(sha256sum "${DEPLOY_DIR}/docker-compose.yml" | awk '{print \$1}')
          if [[ "\${ACTUAL_RUN_SH_SHA256}" != "${RUN_SH_SHA256}" ]]; then
            echo "run.sh sha256 mismatch: expected=${RUN_SH_SHA256} actual=\${ACTUAL_RUN_SH_SHA256}"
            exit 1
          fi
          if [[ "\${ACTUAL_COMPOSE_YML_SHA256}" != "${COMPOSE_YML_SHA256}" ]]; then
            echo "docker-compose.yml sha256 mismatch: expected=${COMPOSE_YML_SHA256} actual=\${ACTUAL_COMPOSE_YML_SHA256}"
            exit 1
          fi
          echo "Synced files verified: run.sh=\${ACTUAL_RUN_SH_SHA256}, docker-compose.yml=\${ACTUAL_COMPOSE_YML_SHA256}"
          if [[ ! -f "${DEPLOY_ENV_PATH}" ]]; then
            echo "Missing env file: ${DEPLOY_ENV_PATH}"
            exit 1
          fi
          cd "${DEPLOY_DIR}"
          export SPRING_PROFILES_ACTIVE="\${SPRING_PROFILES_ACTIVE:-prod}"
          DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}' \
          ENV_FILE_PATH="${DEPLOY_ENV_PATH}" \
          DEPLOY_MOUNT_PATH="${DEPLOY_MOUNT_PATH}" \
          SPRING_PROFILES_ACTIVE="\${SPRING_PROFILES_ACTIVE}" \
          IMAGE_TAG="${GITHUB_SHA}" \
          DEPLOY_MODE=prod \
          ./run.sh
          HEALTH_URL="http://127.0.0.1:8080${HEALTHCHECK_PATH}"
          DEADLINE=\$(( \$(date +%s) + ${HEALTHCHECK_TIMEOUT_SECONDS} ))
          HEALTH_OK=0
          while [[ \$(date +%s) -lt "\${DEADLINE}" ]]; do
            STATUS_CODE=\$(curl -sS -o /tmp/passtival-health.out -w '%{http_code}' --max-time 5 "\${HEALTH_URL}" || true)
            if [[ "\${STATUS_CODE}" == "200" ]]; then
              HEALTH_OK=1
              break
            fi
            echo "Readiness pending: code=\${STATUS_CODE}"
            sleep 5
          done
          if [[ "\${HEALTH_OK}" -ne 1 ]]; then
            echo "Health check failed: \${HEALTH_URL}"
            echo "Last readiness body:"
            cat /tmp/passtival-health.out || true
            echo
            docker ps -a || true
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' passtival-spring-app || true
            docker logs --tail 200 passtival-spring-app || true
            exit 1
          fi
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${TARGET_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "passtival backend deploy ${GITHUB_SHA} on ${TARGET_INSTANCE_ID}" \
            --parameters "$(jq -nc --arg cmd "printf '%s' '${REMOTE_SCRIPT_B64}' | base64 --decode > /tmp/passtival-deploy.sh && bash /tmp/passtival-deploy.sh" '{commands:[$cmd]}')" \
            --query "Command.CommandId" \
            --output text)

          for _ in {1..40}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "${COMMAND_ID}" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "[${TARGET_INSTANCE_ID}] status=${STATUS}"

            if [[ "${STATUS}" == "Success" ]]; then
              exit 0
            fi

            if [[ "${STATUS}" == "Cancelled" || "${STATUS}" == "Cancelling" || "${STATUS}" == "Failed" || "${STATUS}" == "TimedOut" || "${STATUS}" == "Undeliverable" || "${STATUS}" == "Terminated" ]]; then
              aws ssm list-command-invocations \
                --command-id "${COMMAND_ID}" \
                --details \
                --query "CommandInvocations[0].CommandPlugins[0].Output" \
                --output text || true
              exit 1
            fi

            sleep 15
          done

          echo "[${TARGET_INSTANCE_ID}] SSM command did not finish in time."
          exit 1

      - name: 인스턴스 2 롤링 배포
        env:
          TARGET_INSTANCE_ID: ${{ steps.discover.outputs.instance_2 }}
          RUN_SH_B64: ${{ steps.deploy_files.outputs.run_sh_b64 }}
          COMPOSE_YML_B64: ${{ steps.deploy_files.outputs.compose_yml_b64 }}
          RUN_SH_SHA256: ${{ steps.deploy_files.outputs.run_sh_sha256 }}
          COMPOSE_YML_SHA256: ${{ steps.deploy_files.outputs.compose_yml_sha256 }}
        run: |
          REMOTE_SCRIPT_B64=$(cat <<EOF | base64 -w 0
          set -euo pipefail
          mkdir -p "${DEPLOY_DIR}"
          printf '%s' '${RUN_SH_B64}' | base64 --decode > "${DEPLOY_DIR}/run.sh.new"
          printf '%s' '${COMPOSE_YML_B64}' | base64 --decode > "${DEPLOY_DIR}/docker-compose.yml.new"
          mv -f "${DEPLOY_DIR}/run.sh.new" "${DEPLOY_DIR}/run.sh"
          mv -f "${DEPLOY_DIR}/docker-compose.yml.new" "${DEPLOY_DIR}/docker-compose.yml"
          chmod +x "${DEPLOY_DIR}/run.sh"
          ACTUAL_RUN_SH_SHA256=\$(sha256sum "${DEPLOY_DIR}/run.sh" | awk '{print \$1}')
          ACTUAL_COMPOSE_YML_SHA256=\$(sha256sum "${DEPLOY_DIR}/docker-compose.yml" | awk '{print \$1}')
          if [[ "\${ACTUAL_RUN_SH_SHA256}" != "${RUN_SH_SHA256}" ]]; then
            echo "run.sh sha256 mismatch: expected=${RUN_SH_SHA256} actual=\${ACTUAL_RUN_SH_SHA256}"
            exit 1
          fi
          if [[ "\${ACTUAL_COMPOSE_YML_SHA256}" != "${COMPOSE_YML_SHA256}" ]]; then
            echo "docker-compose.yml sha256 mismatch: expected=${COMPOSE_YML_SHA256} actual=\${ACTUAL_COMPOSE_YML_SHA256}"
            exit 1
          fi
          echo "Synced files verified: run.sh=\${ACTUAL_RUN_SH_SHA256}, docker-compose.yml=\${ACTUAL_COMPOSE_YML_SHA256}"
          if [[ ! -f "${DEPLOY_ENV_PATH}" ]]; then
            echo "Missing env file: ${DEPLOY_ENV_PATH}"
            exit 1
          fi
          cd "${DEPLOY_DIR}"
          export SPRING_PROFILES_ACTIVE="\${SPRING_PROFILES_ACTIVE:-prod}"
          DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}' \
          ENV_FILE_PATH="${DEPLOY_ENV_PATH}" \
          DEPLOY_MOUNT_PATH="${DEPLOY_MOUNT_PATH}" \
          SPRING_PROFILES_ACTIVE="\${SPRING_PROFILES_ACTIVE}" \
          IMAGE_TAG="${GITHUB_SHA}" \
          DEPLOY_MODE=prod \
          ./run.sh
          HEALTH_URL="http://127.0.0.1:8080${HEALTHCHECK_PATH}"
          DEADLINE=\$(( \$(date +%s) + ${HEALTHCHECK_TIMEOUT_SECONDS} ))
          HEALTH_OK=0
          while [[ \$(date +%s) -lt "\${DEADLINE}" ]]; do
            STATUS_CODE=\$(curl -sS -o /tmp/passtival-health.out -w '%{http_code}' --max-time 5 "\${HEALTH_URL}" || true)
            if [[ "\${STATUS_CODE}" == "200" ]]; then
              HEALTH_OK=1
              break
            fi
            echo "Readiness pending: code=\${STATUS_CODE}"
            sleep 5
          done
          if [[ "\${HEALTH_OK}" -ne 1 ]]; then
            echo "Health check failed: \${HEALTH_URL}"
            echo "Last readiness body:"
            cat /tmp/passtival-health.out || true
            echo
            docker ps -a || true
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' passtival-spring-app || true
            docker logs --tail 200 passtival-spring-app || true
            exit 1
          fi
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${TARGET_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "passtival backend deploy ${GITHUB_SHA} on ${TARGET_INSTANCE_ID}" \
            --parameters "$(jq -nc --arg cmd "printf '%s' '${REMOTE_SCRIPT_B64}' | base64 --decode > /tmp/passtival-deploy.sh && bash /tmp/passtival-deploy.sh" '{commands:[$cmd]}')" \
            --query "Command.CommandId" \
            --output text)

          for _ in {1..40}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "${COMMAND_ID}" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "[${TARGET_INSTANCE_ID}] status=${STATUS}"

            if [[ "${STATUS}" == "Success" ]]; then
              exit 0
            fi

            if [[ "${STATUS}" == "Cancelled" || "${STATUS}" == "Cancelling" || "${STATUS}" == "Failed" || "${STATUS}" == "TimedOut" || "${STATUS}" == "Undeliverable" || "${STATUS}" == "Terminated" ]]; then
              aws ssm list-command-invocations \
                --command-id "${COMMAND_ID}" \
                --details \
                --query "CommandInvocations[0].CommandPlugins[0].Output" \
                --output text || true
              exit 1
            fi

            sleep 15
          done

          echo "[${TARGET_INSTANCE_ID}] SSM command did not finish in time."
          exit 1
