services:
  backend:
    image: ${DOCKER_USERNAME:-local}/passtival-spring:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: passtival-spring-app
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    volumes:
      - ${DEPLOY_MOUNT_PATH:-./deploy}:/app/deploy
